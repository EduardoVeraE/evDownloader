name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.2"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false

      - name: Sync locked dependencies
        run: uv sync --locked --no-sources --extra dev

      - name: Quality gates
        run: |
          uv run --frozen ruff check src/ tests/ scripts/
          uv run --frozen mypy src/evdownloader scripts/verify_release.py
          uv run --frozen python -m pytest -q

      - name: Build and verify distributions
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          uv build --no-sources --clear --no-create-gitignore --out-dir dist
          python scripts/verify_release.py artifacts dist

  macos-smoke:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false

      - name: Sync and smoke test
        run: |
          uv sync --locked --no-sources
          uv run --frozen evdownloader --version
